name: Backend CI

# Scoped to backend paths so the two ecosystems build independently.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

# A newer push to the same branch/PR supersedes any run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: isort (import order check)
        run: isort --check-only .

      - name: mypy (static types)
        run: mypy app

      - name: pytest
        run: pytest

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: readme
          POSTGRES_PASSWORD: readme
          POSTGRES_DB: readme_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readme -d readme_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: readme
      POSTGRES_PASSWORD: readme
      POSTGRES_DB: readme_ai
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Models match migrations
        run: alembic check

      - name: Downgrade to base and upgrade again
        run: alembic downgrade base && alembic upgrade head

  build-image:
    name: Verify Docker image builds
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t readme-ai/api:ci .
